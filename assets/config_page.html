<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpp-daemon 配置</title>
<style>
  :root{--primary:#2563EB;--primary-d:#1D4ED8;--bg:#F5F7FA;--card:#FFFFFF;--text:#1F2937;--muted:#6B7280;--green:#16A34A;--red:#DC2626}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC",-apple-system,"Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#EEF2FF 0%,var(--bg) 40%);color:var(--text);min-height:100vh;padding:32px 16px}
  .wrap{max-width:680px;margin:0 auto}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-radius:18px;padding:22px 26px;box-shadow:0 12px 30px rgba(37,99,235,.25);display:flex;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:22px;font-weight:600}
  header p{margin:4px 0 0;opacity:.85;font-size:13px}
  .badge{font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.18);transition:.2s}
  .badge.ok{background:rgba(22,163,74,.9)} .badge.err{background:rgba(220,38,38,.9)}
  .card{background:var(--card);border-radius:16px;padding:20px 22px;margin-top:18px;box-shadow:0 6px 18px rgba(17,24,39,.06)}
  .card h2{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px;display:inline-block}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input[type=text],input[type=number],input[type=password],select{width:100%;padding:10px 12px;border:1px solid #E5E7EB;border-radius:10px;font-size:14px;color:var(--text);background:#FCFCFD}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  input:disabled{background:#F3F4F6;color:#9CA3AF}
  .checkbox{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}
  .checkbox input{width:16px;height:16px;accent-color:var(--primary)}
  .plug-state{margin-left:auto;font-size:12px;font-weight:600}
  .actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
  button{cursor:pointer;border:none;border-radius:11px;padding:12px 20px;font-size:14px;font-weight:600;font-family:inherit}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.28)}
  .btn-ghost{background:#EEF2FF;color:var(--primary)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  table.array{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  table.array th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid #E5E7EB}
  table.array td{padding:4px 6px;border-bottom:1px solid #F3F4F6}
  table.array input{width:100%;padding:6px 8px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;background:#FCFCFD}
  table.array input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  table.array input[type=checkbox]{width:16px;height:16px}
  .btn-mini{cursor:pointer;border:none;background:#FEE2E2;color:#B91C1C;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;font-family:inherit}
  .btn-add{margin-top:10px;padding:8px 14px;font-size:13px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>cpp-daemon</h1><p>插件化上报代理 · 本地配置</p></div>
    <div id="badge" class="badge">加载中…</div>
  </header>
  <form id="form" autocomplete="off">
    <div class="card">
      <h2>本节点</h2>
      <label>UUID（节点唯一标识，自动生成）</label>
      <input type="text" id="uuid" disabled>
      <label>显示名称</label>
      <input type="text" id="name" placeholder="节点名称">
      <label class="checkbox"><input type="checkbox" id="autostart"> 开机自动启动（Windows 登录后自动运行）</label>
      <div class="hint">勾选后写入系统自启项（Windows 注册表 Run）；取消则从自启项移除。仅 Windows 生效。</div>
    </div>
    <div class="card">
      <h2>本地服务</h2>
      <label>HTTP 监听地址（仅本机）</label>
      <input type="text" id="http_listen" placeholder="127.0.0.1:9801">
      <div class="hint">修改监听地址保存后会自动重启本地服务。</div>
    </div>
    <div id="pluginWrap"></div>
    <div class="actions">
      <button type="submit" class="btn-primary">保存并应用</button>
      <button type="button" class="btn-ghost" id="refreshBtn">刷新配置</button>
      <button type="button" class="btn-ghost" id="updateBtn">立即上报</button>
    </div>
  </form>
  <footer>cpp-daemon · 状态每间隔自动上报至 RemoteStorage 服务器</footer>
</div>
<div class="toast" id="toast"></div>
<script>
var $ = function(id){ return document.getElementById(id); };
var schemas = {};
var available = [];   // 磁盘上发现的所有插件（含已禁用的）
var loaded = [];      // 当前已加载并运行的插件名
var curCfg = {};      // 当前配置，保存时用于保留未渲染字段的原值
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2600); }
function getNested(o, path){ var parts=path.split('.'); var cur=o; for(var i=0;i<parts.length;i++){ if(cur==null) return ''; cur=cur[parts[i]]; } return cur; }
function setNested(o, path, val){ var parts=path.split('.'); var cur=o; for(var i=0;i<parts.length-1;i++){ var k=parts[i]; if(typeof cur[k]!=='object'||cur[k]==null) cur[k]={}; cur=cur[k]; } cur[parts[parts.length-1]]=val; }
// 可用插件（磁盘上存在）与已加载插件（有 schema）的并集，保证禁用的也能显示开关
var arrays={};   // 数组字段列定义缓存：containerId -> columns
function arrRead(cid, cols){
  var host=document.getElementById('arrbody_'+cid); if(!host) return [];
  var out=[], rows=host.querySelectorAll('tr');
  for(var i=0;i<rows.length;i++){
    var obj={}, ins=rows[i].querySelectorAll('[data-col]');
    for(var k=0;k<ins.length;k++){
      var el=ins[k], c=el.getAttribute('data-col'), ty=el.getAttribute('data-type');
      obj[c]=(ty==='bool')?el.checked:(ty==='number'?(parseInt(el.value,10)||0):el.value);
    }
    out.push(obj);
  }
  return out;
}
function arrRender(cid, cols, rows, hostEl){
  var host=hostEl||document.getElementById('arrbody_'+cid); if(!host) return;
  host.innerHTML='';
  rows.forEach(function(row,idx){
    var tr=document.createElement('tr');
    cols.forEach(function(c){
      var td=document.createElement('td'), el;
      if(c.type==='bool'){ el=document.createElement('input'); el.type='checkbox'; el.checked=!!row[c.key]; }
      else if(c.type==='number'){ el=document.createElement('input'); el.type='number'; el.value=(row[c.key]==null?'':row[c.key]); }
      else { el=document.createElement('input'); el.type='text'; el.value=(row[c.key]==null?'':row[c.key]); }
      el.setAttribute('data-col',c.key); el.setAttribute('data-type',c.type);
      td.appendChild(el); tr.appendChild(td);
    });
    var td2=document.createElement('td'), del=document.createElement('button');
    del.type='button'; del.className='btn-mini'; del.textContent='删除';
    del.onclick=function(){ var r=arrRead(cid,cols); r.splice(idx,1); arrRender(cid,cols,r); };
    td2.appendChild(del); tr.appendChild(td2);
    host.appendChild(tr);
  });
}
function pluginNames(sc){
  var seen={}, out=[];
  (available||[]).forEach(function(n){ if(!seen[n]){ seen[n]=1; out.push(n); } });
  Object.keys(sc||{}).forEach(function(n){ if(!seen[n]){ seen[n]=1; out.push(n); } });
  return out;
}
function renderPlugins(sc, config){
  var wrap=$('pluginWrap'); wrap.innerHTML='';
  pluginNames(sc).forEach(function(name){
    var s=sc[name];
    var card=document.createElement('div'); card.className='card';
    var h=document.createElement('h2'); h.textContent=(s&&s.title)?s.title:name; card.appendChild(h);
    var bucket=(config.plugins&&config.plugins[name])?config.plugins[name]:{};
    var isLoaded=(loaded.indexOf(name)>=0);
    var en=document.createElement('label'); en.className='checkbox';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.id='en_'+name;
    cb.checked=(bucket&&typeof bucket.enabled==='boolean')?bucket.enabled:true;
    en.appendChild(cb); en.appendChild(document.createTextNode(' 启用该插件'));
    var st=document.createElement('span'); st.className='plug-state';
    st.textContent=isLoaded?'已加载':'未加载';
    st.style.color=isLoaded?'var(--green)':'var(--muted)';
    en.appendChild(st);
    card.appendChild(en);

    // 配置项容器：勾选启用立即显示（不必先保存），取消勾选收起。
    // 收起只是隐藏 DOM，值仍在，保存时照旧写回，不会丢配置。
    var body=document.createElement('div');
    if(s&&s.fields&&s.fields.length){
      (s.fields||[]).forEach(function(f){ body.appendChild(renderField(name,f,bucket)); });
    } else {
      var tip=document.createElement('div'); tip.className='hint';
      tip.textContent='该插件未提供可配置项。';
      body.appendChild(tip);
    }
    var offTip=document.createElement('div'); offTip.className='hint';
    offTip.textContent='未启用：勾选上方“启用该插件”即可显示并编辑配置项，保存后立即加载。';
    card.appendChild(body); card.appendChild(offTip);
    cb.onchange=function(){
      body.style.display=cb.checked?'':'none';
      offTip.style.display=cb.checked?'none':'';
    };
    body.style.display=cb.checked?'':'none';
    offTip.style.display=cb.checked?'none':'';
    wrap.appendChild(card);
  });
}
function renderField(name,f,bucket){
  var wrap=document.createElement('div'); var label=document.createElement('label');
  label.textContent=f.label;
  if(f.required){ var star=document.createElement('span'); star.textContent=' *'; star.style.color='var(--red)'; star.style.fontWeight='700'; label.appendChild(star); }
  wrap.appendChild(label);
  // 数组字段：渲染为可增删行的表格（每行一个对象）
  if(f.type==='array'){
    var cols=f.fields||[], cid='a_'+name+'_'+f.key;
    arrays[cid]=cols;
    var rows=getNested(bucket,f.key);
    if(!Array.isArray(rows)) rows=[];
    var tb=document.createElement('table'); tb.className='array';
    var head=document.createElement('thead'), htr=document.createElement('tr');
    cols.forEach(function(c){ var th=document.createElement('th'); th.textContent=c.label; htr.appendChild(th); });
    var thOp=document.createElement('th'); thOp.textContent='操作'; htr.appendChild(thOp);
    head.appendChild(htr); tb.appendChild(head);
    var bodyEl=document.createElement('tbody'); bodyEl.id='arrbody_'+cid; tb.appendChild(bodyEl);
    wrap.appendChild(tb);
    var add=document.createElement('button'); add.type='button'; add.className='btn-ghost btn-add'; add.textContent='+ 添加一行';
    add.onclick=function(){
      var r=arrRead(cid,cols), o={};
      cols.forEach(function(c){ o[c.key]=(c.type==='bool')?true:(c.type==='number'?0:''); });
      r.push(o); arrRender(cid,cols,r);
    };
    wrap.appendChild(add);
    if(f.hint){ var h2=document.createElement('div'); h2.className='hint'; h2.textContent=f.hint; wrap.appendChild(h2); }
    arrRender(cid,cols,rows,bodyEl);  // 此时 tbody 尚未挂入文档，必须用元素引用直接渲染
    return wrap;
  }
  var id='f_'+name+'_'+f.key; var el; var pwBtn=null;
  if(f.type==='bool'){ el=document.createElement('input'); el.type='checkbox'; el.checked=!!getNested(bucket,f.key); }
  else if(f.type==='number'){ el=document.createElement('input'); el.type='number'; var v=getNested(bucket,f.key); el.value=(v==null?'':v); if(f.def) el.placeholder=f.def; }
  else if(f.type==='select'){ el=document.createElement('select'); (f.options||[]).forEach(function(o){ var op=document.createElement('option'); op.value=o; op.textContent=o; if(getNested(bucket,f.key)===o) op.selected=true; el.appendChild(op); }); }
  else if(f.type==='password'){
    el=document.createElement('input'); el.type='password'; var vv=getNested(bucket,f.key); el.value=(vv==null?'':vv); if(f.def) el.placeholder=f.def;
    pwBtn=document.createElement('button'); pwBtn.type='button'; pwBtn.className='btn-ghost';
    pwBtn.textContent='显示'; pwBtn.style.cssText='padding:6px 12px;white-space:nowrap;flex:0 0 auto';
    pwBtn.onclick=function(){ if(el.type==='password'){ el.type='text'; pwBtn.textContent='隐藏'; } else { el.type='password'; pwBtn.textContent='显示'; } };
  }
  else { el=document.createElement('input'); el.type='text'; var vvv=getNested(bucket,f.key); el.value=(vvv==null?'':vvv); if(f.def) el.placeholder=f.def; }
  el.id=id;
  if(pwBtn){
    var pwWrap=document.createElement('div'); pwWrap.style.cssText='display:flex;gap:8px;align-items:center';
    el.style.flex='1'; el.style.width='auto';
    pwWrap.appendChild(el); pwWrap.appendChild(pwBtn); wrap.appendChild(pwWrap);
  } else {
    wrap.appendChild(el);
  }
  if(f.hint){ var hint=document.createElement('div'); hint.className='hint'; hint.textContent=f.hint; wrap.appendChild(hint); }
  return wrap;
}
function collectPlugins(sc, cfg){
  var plugins={};
  pluginNames(sc).forEach(function(name){
    var s=sc[name];
    // 以服务端原桶为底稿，避免禁用插件（字段未渲染）时丢失已保存的配置
    var old=(cfg&&cfg.plugins&&cfg.plugins[name])?cfg.plugins[name]:{};
    var bucket={};
    try{ bucket=JSON.parse(JSON.stringify(old)); }catch(e){ bucket={}; }
    if(s){
      (s.fields||[]).forEach(function(f){
        if(f.type==='array'){
          var cid='a_'+name+'_'+f.key;
          setNested(bucket,f.key,arrRead(cid,arrays[cid]||f.fields||[]));
          return;
        }
        var el=document.getElementById('f_'+name+'_'+f.key); if(!el) return;
        if(f.type==='bool') setNested(bucket,f.key,el.checked);
        else if(f.type==='number') setNested(bucket,f.key,parseInt(el.value,10)||0);
        else setNested(bucket,f.key,el.value);
      });
    }
    var cb=document.getElementById('en_'+name);
    bucket.enabled=cb?cb.checked:true;
    plugins[name]=bucket;
  });
  return plugins;
}
function load(){
  fetch('/api/config').then(function(r){ return r.json(); }).then(function(d){
    var cfg=d.config||{}; schemas=d.schemas||{}; available=d.available_plugins||[]; loaded=d.loaded_plugins||[]; curCfg=cfg;
    $('uuid').value=cfg.uuid||''; $('name').value=cfg.name||''; $('autostart').checked=!!cfg.autostart;
    $('http_listen').value=(cfg.http?cfg.http.listen:'');
    renderPlugins(schemas,cfg); loadStatus();
  }).catch(function(e){ toast('加载失败: '+e.message); });
}
function loadStatus(){
  fetch('/api/status').then(function(r){ return r.json(); }).then(function(st){ updateBadge(st.status); }).catch(function(){});
}
function updateBadge(s){
  var b=$('badge');
  if(!s||!s.last_attempt){ b.textContent='未上报'; b.className='badge'; return; }
  var t=new Date(s.last_attempt).toLocaleString();
  if(s.last_success){ b.textContent='上次上报成功 '+t; b.className='badge ok'; }
  else { b.textContent='上次上报失败 '+t; b.className='badge err'; }
}
function validateRequired(sc){
  var missing=[];
  Object.keys(sc||{}).forEach(function(name){
    var s=sc[name]; if(!s||!s.fields) return;
    var cb=document.getElementById('en_'+name);
    if(cb && !cb.checked) return;   // 已禁用插件不校验
    (s.fields||[]).forEach(function(f){
      if(!f.required) return;
      if(f.type==='bool'||f.type==='array'||f.type==='select') return;  // 仅校验 text/number/password
      var el=document.getElementById('f_'+name+'_'+f.key);
      if(!el) return;
      if((el.value||'').trim()==='') missing.push((s.title||name)+' · '+f.label);
    });
  });
  return missing;
}
$('form').addEventListener('submit', function(e){
  e.preventDefault();
  var missing=validateRequired(schemas);
  if(missing.length){ toast('请填写必填项：'+missing.slice(0,3).join('、')+(missing.length>3?' 等':'')); return; }
  var data={ uuid:$('uuid').value, name:$('name').value, autostart:$('autostart').checked, http:{listen:$('http_listen').value}, plugins:collectPlugins(schemas,curCfg) };
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(function(r){ return r.json(); }).then(function(d){
      if(!d.ok){ toast('保存失败: '+(d.error||'')); }
      else { toast('已保存并应用');
        if(d.schemas){ schemas=d.schemas; available=d.available_plugins||available; loaded=d.loaded_plugins||loaded; curCfg=d.config||curCfg; renderPlugins(schemas,curCfg); loadStatus(); }
        else load(); } })
    .catch(function(e){ toast('保存失败: '+e.message); });
});
$('updateBtn').addEventListener('click', function(){
  fetch('/api/update',{method:'POST'}).then(function(r){ return r.json(); }).then(function(d){ if(d.ok) toast('上报成功'); else toast('上报失败: '+(d.error||'')); loadStatus(); })
    .catch(function(e){ toast('上报失败: '+e.message); });
});
$('refreshBtn').addEventListener('click', function(){ load(); toast('已刷新配置'); });
load();
</script>
</body>
</html>
